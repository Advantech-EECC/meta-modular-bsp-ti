BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "eecc-ti"
BBFILE_PATTERN_eecc-ti = "^${LAYERDIR}/"
BBFILE_PRIORITY_eecc-ti = "9"
LAYERDEPENDS_eecc-ti = "core"
LAYERVERSION_eecc-ti = "4"
LAYERSERIES_COMPAT_eecc-ti = "scarthgap"
